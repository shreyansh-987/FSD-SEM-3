<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
</head>
<style>
    .dashboard-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        border: 1px solid #e6e3e3;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(19, 18, 18, 0.1);
        align-items: center;
        display: flex;
        flex-direction: column;
        align-content: center;
        margin-top: 200px;
        background-image: url('https://img.magnific.com/free-photo/particle-lines-futuristic-gradient-background_53876-104053.jpg');
        background-size: cover;
        background-position: center;
    }
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-image: url('https://c8.alamy.com/comp/KGG6X3/educational-equipment-on-the-student-desk-and-the-blackboard-background-KGG6X3.jpg');
        background-size: cover;
        background-position: center;
    }
    h1 {
        color: #700a0a;
        text-align: center;
    }
    p {
        color: #0f0f0f;
        text-align: center;
    }
    button {
        display: block;
        margin: 20px auto;
        padding: 10px 20px;
        font-size: 16px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        
    }

    a {
    text-decoration: none;
}
</style>
</head>
<body>
    <div class="dashboard-container">
    <h1>Student Dashboard</h1>
    <p>Welcome to your dashboard!</p>
    <p>Here you can view your grades, assignments, and other important information.</p>
    <a href="content.html">
        <button>Login</button>
    </a>
</div>
</body>
</html>
