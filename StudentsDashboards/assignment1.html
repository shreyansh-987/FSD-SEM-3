<!DOCTYPE html>

<html>

<head>

    <title>Quiz Registration</title>

    <style>

        body {
            font-family: Arial;
            background-color: lightblue;
        }

        h1 {
            text-align: center;
        }

        form {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 20px;
        }

        .form-row {
            display: flex;
            margin-bottom: 15px;
        }

        label {
            width: 150px;
        }

        input, select {
            padding: 7px;
        }

        button {
            padding: 8px 25px;
            background-color: blue;
            color: white;
            border-radius: 20px;
        }

    </style>

</head>

<body>

    <h1>FSD-QUIZ</h1>

    <h1>REGISTRATION FORM</h1>

    <form id="quizForm" onsubmit="submitForm(event)">

        <div class="form-row">
            <label>Name:</label>
            <input type="text" id="name"
                   onkeydown="keyDown()"
                   onkeyup="keyUp()"
                   required>
        </div>

        <div class="form-row">
            <label>Class:</label>
            <input type="text" id="class" required>
        </div>

        <div class="form-row">
            <label>Roll Number:</label>
            <input type="text" id="roll" required>
        </div>

        <div class="form-row">
            <label>Admission Number:</label>
            <input type="text" id="adm" required>
        </div>

        <div class="form-row">
            <label>Section:</label>
            <input type="text" id="section" required>
        </div>

        <div class="form-row">
            <label>Branch:</label>
            <input type="text" id="branch" required>
        </div>

        <button type="submit"
                onclick="clickEvent()"
                ondblclick="doubleClickEvent()"
                onmouseover="mouseOver()"
                onmouseout="mouseOut()">
            Register
        </button>

    </form>

    <p id="result"></p>


    <script>

        function clickEvent() {
            console.log("Button clicked");
        }

        function doubleClickEvent() {
            console.log("Button double clicked");
        }

        function mouseOver() {
            console.log("Mouse over button");
        }

        function mouseOut() {
            console.log("Mouse out");
        }


        function submitForm(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let className = document.getElementById("class").value;
            let roll = document.getElementById("roll").value;
            let adm = document.getElementById("adm").value;
            let section = document.getElementById("section").value;
            let branch = document.getElementById("branch").value;

            localStorage.setItem("name", name);
            localStorage.setItem("class", className);
            localStorage.setItem("roll", roll);
            localStorage.setItem("adm", adm);
            localStorage.setItem("section", section);
            localStorage.setItem("branch", branch);

            window.location.href = "quiz.html";
        }


        function keyDown() {
            console.log("Key is pressed");
        }

        function keyUp() {
            console.log("Key is released");
        }

    </script>

</body>

</html>
