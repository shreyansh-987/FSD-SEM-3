<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 560px;
            margin: 24px auto;
            padding: 0 16px;
        }
        h1 {
            margin-bottom: 18px;
        }
        .calculator {
            display: grid;
            gap: 12px;
            padding: 18px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: #f9f9f9;
        }
        label {
            font-weight: 600;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #999;
            box-sizing: border-box;
        }
        button {
            background: #2563eb;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        .result {
            padding: 14px;
            border-radius: 8px;
            background: #eef2ff;
            border: 1px solid #c7d2fe;
        }
    </style>
</head>
<body>
    <h1>Simple Calculator</h1>
    <div class="calculator">
        <label for="value1">First number</label>
        <input type="number" id="value1" placeholder="Enter first number" required>

        <label for="value2">Second number</label>
        <input type="number" id="value2" placeholder="Enter second number" required>

        <label for="operation">Operation</label>
        <select id="operation">
            <option value="add">Add (+)</option>
            <option value="subtract">Subtract (-)</option>
            <option value="multiply">Multiply (×)</option>
            <option value="divide">Divide (÷)</option>
            <option value="modulo">Modulo (%)</option>
        </select>

        <button id="calculateButton">Calculate</button>

        <div id="result" class="result" aria-live="polite">
            Result will appear here.
        </div>
    </div>

    <script>
        const value1Input = document.getElementById('value1');
        const value2Input = document.getElementById('value2');
        const operationSelect = document.getElementById('operation');
        const calculateButton = document.getElementById('calculateButton');
        const resultDiv = document.getElementById('result');

        calculateButton.addEventListener('click', () => {
            const value1 = parseFloat(value1Input.value);
            const value2 = parseFloat(value2Input.value);

            if (Number.isNaN(value1) || Number.isNaN(value2)) {
                resultDiv.textContent = 'Please enter both numbers.';
                return;
            }

            let result;
            switch (operationSelect.value) {
                case 'add':
                    result = value1 + value2;
                    break;
                case 'subtract':
                    result = value1 - value2;
                    break;
                case 'multiply':
                    result = value1 * value2;
                    break;
                case 'divide':
                    if (value2 === 0) {
                        resultDiv.textContent = 'Cannot divide by zero.';
                        return;
                    }
                    result = value1 / value2;
                    break;
                case 'modulo':
                    if (value2 === 0) {
                        resultDiv.textContent = 'Cannot use modulo by zero.';
                        return;
                    }
                    result = value1 % value2;
                    break;
                default:
                    resultDiv.textContent = 'Unknown operation.';
                    return;
            }

            resultDiv.textContent = `Result: ${result}`;
        });
    </script>
</body>
</html>
